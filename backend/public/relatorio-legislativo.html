<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Relatório Legislativo | SDC Serviços de Dados e Comunicação</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .main-dashboard {
      padding: 24px 28px 40px;
      height: 100vh;
      overflow: hidden;
    }

    .relatorio-frame-area {
      height: calc(100vh - 150px);
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, .18);
      border-radius: 18px;
      overflow: hidden;
    }

    .relatorio-frame-area iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    .acoes-relatorio {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-powerbi {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 10px;
      background: #16a34a;
      color: #ffffff;
      text-decoration: none;
      font-weight: 800;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .main-dashboard {
        padding: 16px 12px 24px !important;
        margin-left: 0 !important;
        width: 100% !important;
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      .topbar:not(.dashboard-mobile-top) {
        display: block;
        text-align: center;
      }

      .acoes-relatorio {
        margin-top: 14px;
        flex-direction: column;
        width: 100%;
      }

      .btn-powerbi,
      .btn-nova {
        width: 100%;
      }

      .relatorio-frame-area {
        height: 72vh;
        border-radius: 14px;
      }
    }
  </style>
</head>

<body class="xavier-dashboard">

  <div class="sidebar-overlay" onclick="fecharSidebar()"></div>

  <div class="app-layout">

    <aside class="sidebar">

      <div class="brand">
        <div class="brand-icon">🏛️</div>

        <div>
          <h2>SDC Serviços de Dados e Comunicação</h2>
          <span>PRAIA GRANDE - SP</span>
        </div>
      </div>

      <nav class="menu" aria-label="Menu principal"></nav>

      <div class="sidebar-phone">
        <img src="/img/sdc-marca.svg" alt="SDC Serviços de Dados e Comunicação" style="display:block;width:100%;max-width:220px;height:auto;margin:12px auto">
      </div>

      <div class="sidebar-footer">
        <strong>SDC Serviços de Dados e Comunicação</strong>
        <p>Relatórios legislativos e indicadores externos.</p>
        <span>Versão 1.0.0</span>
      </div>

    </aside>

    <main class="conteudo main-dashboard">

      <header class="topbar dashboard-mobile-top">

        <button type="button" class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Abrir menu">
          ☰
        </button>

        <button class="btn-sair-discreto" onclick="sairSistema()">
          ⇱ Sair
        </button>

      </header>

      <header class="topbar">

        <div>
          <h2>📊 Relatório Legislativo</h2>
          <p class="subtitulo-dashboard">
            SDC Serviços de Dados e Comunicação
          </p>
        </div>

        <div class="topbar-right acoes-relatorio">
          <a href="dashboard.html" class="btn-nova">Dashboard</a>

          <a href="https://app.powerbi.com/view?r=eyJrIjoiMDgwN2QxN2QtNjU4YS00YWVhLWJkYzUtMzgyYjQzZjNlNWNiIiwidCI6IjRmN2YzMWM1LWQ4YzAtNDM5My1hYzAxLTllZjMwNTRmMWRiYiJ9"
             target="_blank"
             class="btn-powerbi">
            Abrir no Power BI
          </a>
        </div>

      </header>

      <section class="relatorio-frame-area">

        <iframe
          title="Relatório Legislativo"
          src="https://app.powerbi.com/view?r=eyJrIjoiMDgwN2QxN2QtNjU4YS00YWVhLWJkYzUtMzgyYjQzZjNlNWNiIiwidCI6IjRmN2YzMWM1LWQ4YzAtNDM5My1hYzAxLTllZjMwNTRmMWRiYiJ9"
          allowfullscreen>
        </iframe>

      </section>

    </main>

  </div>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    function toggleSidebar() {
      const sidebar = document.querySelector(".sidebar");
      const overlay = document.querySelector(".sidebar-overlay");

      if (sidebar) sidebar.classList.toggle("active");
      if (overlay) overlay.classList.toggle("active");

      document.body.classList.toggle("menu-aberto");
    }

    function fecharSidebar() {
      const sidebar = document.querySelector(".sidebar");
      const overlay = document.querySelector(".sidebar-overlay");

      if (sidebar) sidebar.classList.remove("active");
      if (overlay) overlay.classList.remove("active");

      document.body.classList.remove("menu-aberto");
    }

    async function sairSistema() {
      try {
        await fetch("/api/auth/logout", {
          method: "POST",
          credentials: "include"
        });
      } catch (erro) {
        console.error("Erro ao sair:", erro);
      }

      localStorage.clear();
      sessionStorage.clear();
      window.location.href = "/index.html";
    }

    document.querySelectorAll(".menu a").forEach(link => {
      const paginaAtual = window.location.pathname.split("/").pop();
      const href = link.getAttribute("href");

      if (href === paginaAtual) {
        link.classList.add("active");
      }

      link.addEventListener("click", fecharSidebar);
    });
  </script>

</body>

</html>
